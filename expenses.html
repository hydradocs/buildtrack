<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BuildTrack — Expenses</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:70px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.logo{width:38px;height:38px;border-radius:11px;background:#111827;color:#fff;display:grid;place-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#e9edf3;display:grid;place-items:center;font-weight:700}main{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}h1{margin:0 0 6px;font-size:30px}h2{font-size:18px;margin:0}.muted{color:#687386;font-size:13px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#111827;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.filters{background:#fff;border:1px solid #e5e9f0;border-radius:15px;padding:16px;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:10px}.filters input,.filters select{width:100%;padding:11px;border:1px solid #dce2ea;border-radius:9px;font:inherit}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card{background:#fff;border:1px solid #e5e9f0;border-radius:15px;padding:18px}.label{color:#687386;font-size:12px}.value{font-size:23px;font-weight:800;margin-top:6px}.table-card{background:#fff;border:1px solid #e5e9f0;border-radius:15px;overflow:hidden}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid #edf0f4}th{font-size:12px;color:#687386;background:#fafbfc}td{font-size:14px}.amount{font-weight:800;text-align:right}.badge{display:inline-block;border-radius:18px;padding:5px 8px;font-size:11px;font-weight:700;background:#edf4ff;color:#2563eb}.empty{text-align:center;padding:40px;color:#687386}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}@media(max-width:520px){.top{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">B</div>BuildTrack</div><div class="avatar">HS</div></header>
<main>
<div class="top"><div><h1>Expenses</h1><div class="muted">Every recorded project expense in one place.</div></div><a class="btn" href="index.html">← Dashboard</a></div>
<div class="filters"><input id="search" placeholder="Search expense, project..." oninput="render()"><select id="project" onchange="render()"><option value="">All projects</option></select><select id="category" onchange="render()"><option value="">All categories</option><option>Material</option><option>Labour</option><option>Transport</option><option>Equipment</option><option>Miscellaneous</option></select><input id="date" type="date" onchange="render()"></div>
<div class="summary"><div class="card"><div class="label">TOTAL EXPENSES</div><div class="value" id="total">₹0</div></div><div class="card"><div class="label">MATERIALS</div><div class="value" id="materials">₹0</div></div><div class="card"><div class="label">LABOUR</div><div class="value" id="labour">₹0</div></div><div class="card"><div class="label">TRANSPORT</div><div class="value" id="transport">₹0</div></div></div>
<div class="table-card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Expense</th><th>Category</th><th>Project</th><th>Quantity</th><th class="amount">Amount</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" style="display:none">No matching expenses found.</div></div>
</main>
<script>
const EKEY='buildtrack_entries',PKEY='buildtrack_projects_v1';
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function loadProjects(){const p=JSON.parse(localStorage.getItem(PKEY)||'[]');document.getElementById('project').innerHTML='<option value="">All projects</option>'+p.map(x=>`<option>${esc(x.name)}</option>`).join('')}
function entries(){return JSON.parse(localStorage.getItem(EKEY)||'[]').filter(e=>Number(e.amount)>0)}
function render(){const q=document.getElementById('search').value.toLowerCase().trim(),project=document.getElementById('project').value,category=document.getElementById('category').value,date=document.getElementById('date').value;let data=entries().filter(e=>(!q||((e.name||'')+' '+(e.projectName||'')).toLowerCase().includes(q))&&(!project||e.projectName===project)&&(!category||e.category===category)&&(!date||e.isoDate===date));document.getElementById('total').textContent=money(data.reduce((s,e)=>s+Number(e.amount||0),0));document.getElementById('materials').textContent=money(data.filter(e=>e.category==='Material').reduce((s,e)=>s+Number(e.amount||0),0));document.getElementById('labour').textContent=money(data.filter(e=>e.category==='Labour').reduce((s,e)=>s+Number(e.amount||0),0));document.getElementById('transport').textContent=money(data.filter(e=>e.category==='Transport').reduce((s,e)=>s+Number(e.amount||0),0));document.getElementById('rows').innerHTML=data.map(e=>`<tr><td>${esc(e.date)}</td><td><b>${esc(e.name)}</b></td><td><span class="badge">${esc(e.category)}</span></td><td>${esc(e.projectName||'—')}</td><td>${e.quantity!=null?esc(e.quantity+' '+e.unit):'—'}</td><td class="amount">${money(e.amount)}</td></tr>`).join('');document.getElementById('empty').style.display=data.length?'none':'block'}
loadProjects();render();
</script>
</body></html>
